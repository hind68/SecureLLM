spring.application.name=backend
server.port=8080
litellm.base-url=http://localhost:4000
litellm.master-key=${LITELLM_MASTER_KEY}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/secure_llm_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:secure_llm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
