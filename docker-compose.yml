services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_llm_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-secure_llm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - secure_llm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secure_llm_user} -d ${POSTGRES_DB:-secure_llm_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: secure-llm-litellm
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-litellm}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    restart: unless-stopped

  dlp-service:
    build:
      context: ./dlp
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DLP_MAX_TEXT_LENGTH: "50000"
      DLP_MAX_FILE_SIZE_MB: "20"
      DLP_MAX_ATTACHMENTS: "10"
      DLP_MAX_ZIP_UNCOMPRESSED_MB: "50"
      DLP_MAX_ZIP_FILES: "50"
      DLP_MAX_ZIP_DEPTH: "3"
      DLP_LOG_LEVEL: "INFO"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  secure_llm_postgres_data:
